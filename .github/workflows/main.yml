name: Build Assets for Git Install
on:
  push:
    branches:
      - feature/websocket-lifecycle-callbacks
      # Add other development branches as needed
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Need write permission to commit built assets

jobs:
  build-assets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push to protected branches if needed
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Install Node, pnpm and dependencies
        uses: ./.github/actions/pnpm-node-install
        with:
          pnpm-install-args: --no-frozen-lockfile
          
      - name: Install Python, uv and Python dependencies
        uses: ./.github/actions/uv-python-install
        with:
          working-directory: ./backend
          
      - name: Build frontend and prepare assets
        run: uv run python build.py
        working-directory: ./backend
        
      - name: Verify build artifacts exist
        run: |
          echo "Checking for build artifacts..."
          ls -la backend/chainlit/frontend/dist/ || echo "Frontend dist not found"
          ls -la backend/chainlit/copilot/dist/ || echo "Copilot dist not found"
          
          # Ensure the directories exist (build.py should create them)
          if [ ! -d "backend/chainlit/frontend/dist" ]; then
            echo "Error: frontend/dist directory not created by build"
            exit 1
          fi
          if [ ! -d "backend/chainlit/copilot/dist" ]; then
            echo "Error: copilot/dist directory not created by build"
            exit 1
          fi
        
      - name: Check if assets changed
        id: check_changes
        run: |
          # Check if directories exist and have content
          if [ ! -d "backend/chainlit/frontend/dist" ] || [ ! -d "backend/chainlit/copilot/dist" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Assets missing, will commit"
            exit 0
          fi
          
          # Force add the ignored directories
          git add -f backend/chainlit/frontend/dist/ backend/chainlit/copilot/dist/
          
          # Check if there are any changes staged
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to built assets"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Built assets have changes"
          fi
          
      - name: Commit built assets
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Force add the ignored directories
          git add -f backend/chainlit/frontend/dist/ backend/chainlit/copilot/dist/
          git commit -m "chore: update built frontend assets [skip ci]"
          git push
